# ==============================================================================
# HỆ THỐNG PHÂN LOẠI NGÔN NGỮ CÔNG KÍCH (TOXIC / NON-TOXIC)
# CẤU HÌNH E5 (GaussianNB) & E6 (Linear SVM) — FASTTEXT REPRESENTATION
# TUÂN THỦ NGHIÊM NGẶT KẾ HOẠCH NLP_N12 V2.0 VÀ TÀI LIỆU CẤU TRÚC
# ==============================================================================

project:
  name: "toxic_classification_e5_e6"
  description: "Phân loại nhị phân bình luận tiếng Việt PTIT thành Toxic (1) và Non-toxic (0)"
  seed: 42

paths:
  raw_data:
    train: "data/raw/train.xlsx"
    val: "data/raw/val.xlsx"
    test: "data/raw/test.xlsx"
  segmented_data:
    train: "data/segmented/train_segmented.xlsx"
    val: "data/segmented/val_segmented.xlsx"
    test: "data/segmented/test_segmented.xlsx"
  resources:
    vncorenlp_dir: "resources/vncorenlp"
    vncorenlp_jar: "resources/vncorenlp/VnCoreNLP-1.2.jar"
    fasttext_manifest: "resources/fasttext/fasttext_resource_manifest.json"
  artifacts:
    base_dir: "artifacts"
    embeddings_dir: "artifacts/embeddings"
    models_dir: "artifacts/models"
    fasttext_model: "artifacts/embeddings/fasttext_model.bin"
    train_vectors: "artifacts/embeddings/train_vectors.npz"
    val_vectors: "artifacts/embeddings/val_vectors.npz"
    test_vectors: "artifacts/embeddings/test_vectors.npz"
    e5_model: "artifacts/models/e5_gaussian_nb_model.pkl"
    e6_model: "artifacts/models/e6_linear_svm_model.pkl"
  results:
    base_dir: "results"
    e5_dir: "results/e5_gaussian_nb"
    e6_dir: "results/e6_linear_svm"
    comparison_dir: "results/comparison"
    e5_val_metrics: "results/e5_gaussian_nb/e5_val_metrics.json"
    e5_test_metrics: "results/e5_gaussian_nb/e5_test_metrics.json"
    e5_predictions: "results/e5_gaussian_nb/e5_predictions.xlsx"
    e6_val_metrics: "results/e6_linear_svm/e6_val_metrics.json"
    e6_test_metrics: "results/e6_linear_svm/e6_test_metrics.json"
    e6_predictions: "results/e6_linear_svm/e6_predictions.xlsx"
    comparison_report: "results/comparison/e5_vs_e6_comparison_report.xlsx"

columns:
  id_columns:
    sample_id: "sample_id"
    post_id: "post_id"
    comment_id: "comment_id"
    comment_type: "comment_type"
    data_status: "data_status"
  label_column: "label"

  # Cột văn bản gốc chỉ lưu đối chiếu, TUYỆT ĐỐI KHÔNG đưa vào dự đoán
  raw_source_mapping:
    message: "message_original"
    post: "post_message"
    parent: "parent_message"

  # Cột văn bản đã làm sạch — Đầu vào cho bước tách từ VNCoreNLP
  cleaned_mapping:
    message: "message_clean"
    post: "post_clean"
    parent: "parent_clean"

  # Cột văn bản đã tách từ VNCoreNLP — Đầu vào cho biểu diễn fastText & dự đoán
  segmented_mapping:
    message: "message_segmented"
    post: "post_segmented"
    parent: "parent_segmented"

validation:
  strict_group_split: false  # Nếu false: ghi cảnh báo khi post_id trùng lặp giữa các tập; nếu true: chặn chương trình

# Chế độ đầu vào dự đoán:
# - "comment_only": Chỉ dùng message_clean -> message_segmented (Chuẩn mặc định cho E5 & E6)
# - "context_aware": Dùng cả post_clean, parent_clean, message_clean -> [post; parent; message]
prediction_input_mode: "comment_only"

segmentation:
  engine: "vncorenlp"
  annotators:
    - "wseg"
  max_heap_size: "-Xmx2g"

fasttext:
  # Đường dẫn model fastText pre-trained (nếu có .bin) hoặc null để tự học từ Train split
  pretrained_path: null
  dim: 100
  pooling: "mean_max"  # "mean" (truyền thống) hoặc "mean_max" (kết hợp trung bình và cực đại 200d)
  ws: 5
  epoch: 25
  min_count: 1
  minn: 2
  maxn: 5
  lr: 0.05
  thread: 4
  loss: "ns"
  weighting: "none"  # "none" (average) hoặc "tfidf" (trọng số TF-IDF học CHỈ từ tập Train)

e5_gaussian_nb:
  var_smoothing_grid:
    - 1.0e-9
    - 1.0e-8
    - 1.0e-7
    - 1.0e-6
    - 1.0e-5
    - 1.0e-4
    - 1.0e-3
    - 1.0e-2
    - 1.0e-1
  tune_threshold: true
  threshold_grid_step: 0.05

e6_linear_svm:
  c_grid:
    - 0.01
    - 0.05
    - 0.1
    - 0.5
    - 1.0
    - 5.0
    - 10.0
    - 50.0
    - 100.0
  class_weight_grid:
    - null
    - "balanced"
  max_iter: 3000
  random_state: 42
  tune_threshold: true
  threshold_grid_step: 0.05
